      // data extraction
      function parseMaybeNumber(value) {
        if (value === '' || value == null) return null;
        var n = parseInt(value, 10);
        return isNaN(n) ? null : n;
      }

      function collectBranchChatItems(listEl) {
        var items = [];
        if (!listEl) return items;

        Array.from(listEl.children).forEach(function(branchItem) {
          if (!branchItem.classList || !branchItem.classList.contains('chat-branch-item')) return;

          var row = null;
          Array.from(branchItem.children).forEach(function(child) {
            if (!row && child.classList && child.classList.contains('chat-row')) {
              row = child;
            }
          });

          if (!row) return;

          var data = getChatRowData(row);
          if (data && Object.keys(data).length) {
            items.push(data);
          }
        });

        return items;
      }

      function getChatReplyData(replyRow) {
        var replyText = replyRow.querySelector('.chat-reply-text').value.trim(),
            replyTranslation = replyRow.querySelector('.chat-reply-translation').value.trim(),
            isCorrect = replyRow.querySelector('.chat-reply-correct').checked,
            hasBranch = replyRow.querySelector('.chat-has-branch').checked,
            branchWrap = replyRow.querySelector('.chat-branch-wrap'),
            branchList = branchWrap ? branchWrap.querySelector('.chat-branch-list') : null,
            branchItems = hasBranch && branchList ? collectBranchChatItems(branchList) : [],
            sourceText,
            replyValue = null;

        if (!replyText) {
          return null;
        }

        sourceText = (isCorrect ? '〇' : '') + replyText;

        if (branchItems.length === 1) {
          replyValue = [sourceText, branchItems[0]];
        } else if (branchItems.length > 1) {
          replyValue = [sourceText, branchItems];
        } else {
          replyValue = sourceText;
        }

        return {
          value : replyValue,
          translation : replyTranslation
        };
      }

      function getModeScoreCheckbox(row, mode) {
        var block = getDirectChildByClass(row, 'chat-mode-' + mode);
        return block ? block.querySelector(':scope > .chat-inline .chat-score-enabled') : null;
      }

      function getEnabledScore(row) {
        var mode = row.querySelector('.chat-item-type').value,
            enabled = getModeScoreCheckbox(row, mode);
        if (!enabled || !enabled.checked) return null;

        var scoreInput = row.querySelector('.chat-item-header .chat-score');
        return scoreInput ? parseMaybeNumber(scoreInput.value) : null;
      }

      function getDirectReplyRows(row) {
        var replyBlock = Array.from(row.children).find(function(child) {
          return child.classList && child.classList.contains('chat-mode-reply');
        });

        if (!replyBlock) return [];

        var subsection = Array.from(replyBlock.children).find(function(child) {
          return child.classList && child.classList.contains('chat-subsection');
        });

        if (!subsection) return [];

        var repliesList = Array.from(subsection.children).find(function(child) {
          return child.classList && child.classList.contains('chat-replies');
        });

        if (!repliesList) return [];

        return Array.from(repliesList.children).filter(function(child) {
          return child.classList && child.classList.contains('chat-reply-row');
        });
      }
      
      function getChatRowData(row) {
        var data = {},
            mode = row.querySelector('.chat-item-type').value,
            delay = parseMaybeNumber(row.querySelector('.chat-delay').value),
            score = getEnabledScore(row),
            newListEl = row.querySelector('.chat-new-list'),
            newList = newListEl ? newListEl.checked : false;

        if (mode === 'delay') {
          if (delay !== null) data.delay = delay;
          return data;
        }

        if (delay !== null) data.delay = delay;

        if (mode === 'message') {
          var message = row.querySelector('.chat-message').value.trim(),
              translation = row.querySelector('.chat-translation').value.trim();

          if (message) data.message = message;
          if (translation) data.translation = translation;
          if (score !== null) data.score = score;
          if (newList) data.newList = true;

        } else if (mode === 'reply') {
          var replies = [],
              replyTranslations = [],
              isProblem = row.querySelector('.chat-is-problem').checked;

          getDirectReplyRows(row).forEach(function(replyRow) {
            var replyData = getChatReplyData(replyRow);
            if (!replyData) return;

            replies.push(replyData.value);
            replyTranslations.push(replyData.translation);
          });

          if (replies.length) data.reply = replies;
          if (replyTranslations.some(function(text) { return text.trim() !== ''; })) {
            data.translation = replyTranslations;
          }
          if (isProblem) data.problem = true;
          if (score !== null) data.score = score;

        } else if (mode === 'info') {
          var info = row.querySelector('.chat-info').value.trim();
          if (info) data.info = info;

        } else if (mode === 'image') {
          var image = row.querySelector('.chat-image').value.trim();
          if (image) data.image = image;

        } else if (mode === 'input_reply') {
          var inputId = row.querySelector('.chat-input-id').value.trim(),
              inputPlaceholder = row.querySelector('.chat-input-placeholder').value.trim(),
              inputInfo = row.querySelector('.chat-input-info').value.trim(),
              inputResponse = row.querySelector('.chat-input-response').value.trim(),
              inputError = row.querySelector('.chat-input-error').value.trim(),
              inputSave = row.querySelector('.chat-input-save').value === 'true';

          data.input_reply = {};

          if (inputId) data.input_reply.id = inputId;
          if (inputSave) data.input_reply.save = true;
          if (inputPlaceholder) data.input_reply.placeholder = inputPlaceholder;
          if (inputInfo) data.input_reply.info = inputInfo;
          if (inputResponse) data.input_reply.response = inputResponse;
          if (inputError) data.input_reply.error = inputError;

          if (!Object.keys(data.input_reply).length) {
            delete data.input_reply;
          }
        }
        
        return data;
      }

      function getQuizletData(type) {
        if (type === 'vocab') {
          var data = {};
          document.querySelectorAll('#vocab-list .item-row').forEach(function(row) {
            var w = row.querySelector('.v-word').value.trim();
            var f = row.querySelector('.v-furi').value.trim();
            var d = row.querySelector('.v-def').value.trim();
            var s = row.querySelector('.v-sent').value.trim();
            if (w || d) {
              data[w + (f ? '|' + f : '')] = d + (s ? '|' + s : '');
            }
          });

          return data;

        } else if (type === 'kanji') {
          var mode = el.kanjiMode.value,
              kdata = mode.includes('stroke') ? [] : {};

          document.querySelectorAll('#kanji-list .item-row').forEach(function(row) {
            var k = row.querySelector('.k-kanji') ? row.querySelector('.k-kanji').value.trim() : '',
                m = row.querySelector('.k-mean') ? row.querySelector('.k-mean').value.trim() : '',
                on = row.querySelector('.k-on') ? row.querySelector('.k-on').value.trim() : '',
                kun = row.querySelector('.k-kun') ? row.querySelector('.k-kun').value.trim() : '',
                r = on + (kun ? '|' + kun : '');

            if (k) {
              if (mode.includes('meaning')) {
                kdata[k] = m;

              } else if (mode.includes('reading')) {
                kdata[k + (m ? '|' + m : '')] = r;

              } else if (mode.includes('stroke')) {
                var sElem = row.querySelector('.k-strokes'),
                    oElem = row.querySelector('.k-order'),
                    s = sElem ? sElem.value.trim() : '0',
                    o = oElem ? oElem.value.trim() : '',
                    exs = [];

                row.querySelectorAll('.kanji-example-row').forEach(function(exRow) {
                  var ek = exRow.querySelector('.kx-kanji').value.trim(),
                      ef = exRow.querySelector('.kx-furi').value.trim(),
                      ed = exRow.querySelector('.kx-def').value.trim();

                  if (ek || ed) {
                    var obj = {};
                    obj[ek + (ef ? '|' + ef : '')] = ed;
                    exs.push(obj);
                  }
                });

                kdata.push({ kanji: k, meaning: m, reading: r, strokes: parseInt(s, 10) || 0, order: o, example_words: exs });
              }
            }
          });

          return kdata;

        } else if (type === 'multi') {
          var data2 = [];
          document.querySelectorAll('#multi-list .question-row').forEach(function(row) {
            var q = row.querySelector('.m-q').value.trim(),
                ans = [];

            row.querySelectorAll('.quiz-answer').forEach(function(arow) {
              var c = arow.querySelector('.m-correct').checked,
                  aText = arow.querySelector('.m-ans').value.trim();

              if (aText) {
                ans.push((c ? 'A' : '') + (!c && /^A/.test(aText) ? '!' : '') + aText);
              }
            });

            if (q || ans.length > 0) data2.push({ question: q, answers: ans });
          });

          return data2;

        } else if (type === 'written') {
          return cmEditor.getValue();

        } else if (type === 'chat') {
          var data3 = [];
          Array.from(el.chatList.children).forEach(function(itemEl) {
            if (!itemEl.classList.contains('chat-top-item')) return;

            var row = Array.from(itemEl.children).find(function(child) {
              return child.classList && child.classList.contains('chat-row');
            });

            if (!row) return;

            var item = getChatRowData(row);
            if (Object.keys(item).length > 0) data3.push(item);
          });
          return data3;
        }
      }

      function padContentForExport(html) {
        if (!html) return "''";
        var lines = html.split(/\r?\n/);
        
        return lines.map(function(line) {
          var str = line.replace(/'/g, "\\'").replace(/<\/script>/gi, '<\\/script>')
                        .replace(/\[alts:([^\|\]]+)\|([^\]]+)\]/g, "' + Kantan.getAlts('$1', '$2') + '");
          
          return "'" + str + "\\n'";
        }).join('+\n        ');
      }
      
      function escapeJSString(str) {
        return String(str)
          .replace(/\\/g, '\\\\')
          .replace(/'/g, "\\'")
          .replace(/\r/g, '\\r')
          .replace(/\n/g, '\\n')
          .replace(/<\/script>/gi, '<\\/script>');
      }

      function serializeChatValue(value, indent) {
        indent = indent || 10;
        var pad = ' '.repeat(indent),
            childPad = ' '.repeat(indent + 2);

        if (Array.isArray(value)) {
          if (!value.length) return '[]';

          return '[\n' + value.map(function(item) {
            return childPad + serializeChatValue(item, indent + 2);
          }).join(',\n') + '\n' + pad + ']';
        }

        if (value && typeof value === 'object') {
          var keys = Object.keys(value);
          if (!keys.length) return '{}';

          return '{\n' + keys.map(function(key) {
            return childPad + key + ' : ' + serializeChatValue(value[key], indent + 2);
          }).join(',\n') + '\n' + pad + '}';
        }

        if (typeof value === 'number' || typeof value === 'boolean') {
          return String(value);
        }

        if (value == null) {
          return 'null';
        }

        return "'" + escapeJSString(value) + "'";
      }

      function serializeChatQuizlet(chatData) {
        return '[\n' + chatData.map(function(item) {
          return '        ' + serializeChatValue(item, 8);
        }).join(',\n        \n') + '\n      ]';
      }

                    qStr2 = qStr2.replace(/(<\/div>|<\/p>|<br>|<br\s*\/?>)/gi, '$1\n')
                                 .replace(/(<div class="problem">|<div class="count-problems|<p class="sectionDesc|<div class="sub-section)/gi, '\n$1')

        if (html) {

        } else {

          };
          reader.readAsText(file);
        }
      }
      
      function normalizeImportedChatItem(item, preserveCombined) {
        if (!item || typeof item !== 'object') return [item];

        var cloned = JSON.parse(JSON.stringify(item));

        if (Array.isArray(cloned.reply)) {
          cloned.reply = cloned.reply.map(function(replyItem) {
            if (Array.isArray(replyItem) && replyItem.length > 1) {
              var branchValue = replyItem[1];

              if (Array.isArray(branchValue)) {
                branchValue = branchValue.map(function(branchItem) {
                  return normalizeImportedChatItem(branchItem, true)[0];
                });
              } else if (branchValue && typeof branchValue === 'object') {
                branchValue = normalizeImportedChatItem(branchValue, true)[0];
              }

              return [replyItem[0], branchValue];
            }

            return replyItem;
          });
        }

        if (!preserveCombined && cloned.message && Array.isArray(cloned.reply)) {
          var messageItem = Object.assign({}, cloned),
              replyItem = {
                reply : cloned.reply
              };

          delete messageItem.reply;

          if (Array.isArray(cloned.translation)) {
            replyItem.translation = cloned.translation;
            delete messageItem.translation;
          }

          if (cloned.problem) {
            replyItem.problem = true;
            delete messageItem.problem;
          }

          if (cloned.score !== undefined) {
            replyItem.score = cloned.score;
            delete messageItem.score;
          }

          if (cloned.newList) {
            replyItem.newList = true;
            delete messageItem.newList;
          }

          return [messageItem, replyItem];
        }

        return [cloned];

            '<div class="input-box-info">' + parseChatPreviewText(reply.info || '') + '</div>' +
            '<div class="input-box-container">' +
              '<input type="text" value="' + escapeAttribute(reply.placeholder || '') + '">' +
              '<button class="button" type="button"><i class="fa">&#xf1d8;</i>Send</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      }

      function renderChatPreviewInfo(item) {
        var info = item.info || '',
            extraClass = /^\{RED\}/.test(info) ? ' info-red' :
                         /^\{GREEN\}/.test(info) ? ' info-green' : '',
            linkPath = item._editorNodePath || item._editorLinkPath || '';

        return '<div class="chat-info' + extraClass + '" data-chat-link-path="' + escapeAttribute(linkPath) + '" data-chat-link-type="item">' +
          parseChatPreviewText(info.replace(/^\{RED\}|^\{GREEN\}/g, '')) +
        '</div>';
      }

      function renderChatPreviewDelay(item) {
        var linkPath = item._editorNodePath || item._editorLinkPath || '';
        return '<div class="chat-preview-delay" data-chat-link-path="' + escapeAttribute(linkPath) + '" data-chat-link-type="item"><span>Delay: ' + escapeChatPreviewHTML(String(item.delay || 0)) + 'ms</span></div>';
      }

      function renderChatPreviewItem(item) {
        if (!item || typeof item !== 'object') return '';

        if (item.message || item.image) return renderChatPreviewMessageGroup(item, renderChatPreviewMessageRows(item));
        if (item.reply) return renderChatPreviewReply(item);
        if (item.input_reply) return renderChatPreviewInputReply(item);
        if (item.info) return renderChatPreviewInfo(item);
        if (item.delay != null) return renderChatPreviewDelay(item);

        return '';
      }

      function buildChatPreviewMessages(items) {
        var html = '',
            lastKey = '',
            group = null; 

        function flush() {
          if (group) html += renderChatPreviewMessageGroup(group.item, group.rows);
          group = null;
        }

        (items || []).forEach(function(item) {
          if (!item || typeof item !== 'object') return;

          if (item.newList) lastKey = '';

          if (item.message || item.image) {
            var key = (item.name || 'Kan-tan') + '|' + (item.side || 'left');

            if (group && key === lastKey) {
              group.rows += renderChatPreviewMessageRows(item);
            }
            else {
              flush();
              group = { item : item, rows : renderChatPreviewMessageRows(item) };
              lastKey = key;
            }
            return;
          }

          flush();
          html += renderChatPreviewItem(item);

          // choice/input replies reset the grouping
          if (item.reply || item.input_reply) lastKey = '';
        });

        flush();
        return html;
      }

      function renderChatPreview(init) {
        if (window.ChatRenderDelay) {
          clearTimeout(window.ChatRenderDelay);
          delete window.ChatRenderDelay;
        }
        
        if (!window.ChatRenderDelay) {
          window.ChatRenderDelay = setTimeout(function () {
            if (!el.chatPreview) return;

            if (el.pgType.value !== 'chat') {
              el.chatPreview.innerHTML = '';
              return;
            }

            var chatData = getLinkedChatPreviewData();

            el.chatPreview.innerHTML =
              '<div id="kantan-chat-container">' +
                '<div id="kantan-chat" class="fullscreen">' +
                  '<div id="kantan-chat-title">' +
                    '<i class="fa">&#xf086;</i>かんたんChat ' +
                  '</div>' +
                  '<div id="kantan-chat-messages">' +
                    buildChatPreviewMessages(chatData) +
                  '</div>' +
                '</div>' +
              '</div>';
            
            if (el.autoScroll.checked) highlightLinkedPreviewElement(activeEditorLinkPath, activeEditorLinkType);
            
            delete window.ChatRenderDelay;
          }, init ? 1 : 500);
        }
      }
      
      function sanitizeChatPreviewHTML(html) {
        if (!html) return '';

        var template = document.createElement('template');
        template.innerHTML = String(html).replace(/<script/gi, '&lt;script');

        var allowedTags = {
          A: true,
          B: true,
          BR: true,
          CODE: true,
          EM: true,
          I: true,
          IMG: true,
          RUBY: true,
          RT: true,
          RP: true,
          SMALL: true,
          SPAN: true,
          STRONG: true,
          SUB: true,
          SUP: true,
          U: true
        };

        var allowedAttrs = {
          class: true,
          href: true,
          src: true,
          target: true,
          rel: true,
          title: true,
          alt: true
        };

        function cleanNode(node) {
          if (node.nodeType === 1) {
            var tagName = node.tagName.toUpperCase();

            if (!allowedTags[tagName]) {
              var text = document.createTextNode(node.textContent || '');
              node.parentNode.replaceChild(text, node);
              return;
            }

            Array.from(node.attributes).forEach(function(attr) {
              var name = attr.name.toLowerCase(),
                  value = attr.value || '';

              if (!allowedAttrs[name] || /^on/i.test(name)) {
                node.removeAttribute(attr.name);
                return;
              }

              if ((name === 'href' || name === 'src') && /^\s*javascript:/i.test(value)) {
                node.removeAttribute(attr.name);
                return;
              }
            });

            if (tagName === 'A') {
              node.setAttribute('target', '_blank');
              node.setAttribute('rel', 'noopener noreferrer');
            }
          }

          Array.from(node.childNodes).forEach(cleanNode);
        }

        Array.from(template.content.childNodes).forEach(cleanNode);
        return template.innerHTML;
      }
      
      // chat editor preview linking
      var activeEditorLinkPath = '',
          activeEditorLinkType = '',
          activePreviewLinkPath = '',
          activePreviewLinkType = '';
      
      function clearLinkedHighlights() {
        document.querySelectorAll('.chat-editor-linked-highlight').forEach(function(node) {
          node.classList.remove('chat-editor-linked-highlight');
        });

        if (el.chatPreview) {
          el.chatPreview.querySelectorAll('.chat-preview-linked-highlight').forEach(function(node) {
            node.classList.remove('chat-preview-linked-highlight');
          });
        }
      }

      function getChatRowFromContainer(container) {
        if (!container) return null;

        return Array.from(container.children).find(function(child) {
          return child.classList && child.classList.contains('chat-row');
        }) || null;
      }

      function getTopLevelChatItems() {
        return Array.from(el.chatList.children).filter(function(item) {
          return item.classList && item.classList.contains('chat-top-item');
        });
      }

      function getBranchItems(branchList) {
        if (!branchList) return [];
        return Array.from(branchList.children).filter(function(item) {
          return item.classList && item.classList.contains('chat-branch-item');
        });
      }

      function getReplyRows(row) {
        return getDirectReplyRows(row);
      }

      function getTopLevelIndex(topItem) {
        return getTopLevelChatItems().indexOf(topItem);
      }

      function getBranchIndex(branchItem) {
        if (!branchItem || !branchItem.parentNode) return -1;
        return getBranchItems(branchItem.parentNode).indexOf(branchItem);
      }

      function getReplyIndex(replyRow) {
        if (!replyRow || !replyRow.parentNode) return -1;

        return Array.from(replyRow.parentNode.children).filter(function(node) {
          return node.classList && node.classList.contains('chat-reply-row');
        }).indexOf(replyRow);
      }

      function getItemPathFromContainer(container) {
        if (!container) return '';

        var branchItem = container.closest('.chat-branch-item');
        if (branchItem) {
          var branchWrap = branchItem.closest('.chat-branch-wrap');
          if (!branchWrap) return '';

          var parentReplyRow = branchWrap.closest('.chat-reply-row');
          if (!parentReplyRow) return '';

          var parentReplyPath = getReplyPathFromReplyRow(parentReplyRow);
          if (!parentReplyPath) return '';

          var branchIndex = getBranchIndex(branchItem);
          if (branchIndex === -1) return '';

          return parentReplyPath + '-branch-' + branchIndex;
        }

        var topItem = container.closest('.chat-top-item');
        if (topItem) {
          var topIndex = getTopLevelIndex(topItem);
          if (topIndex === -1) return '';
          return 'item-' + topIndex;
        }

        return '';
      }

      function getReplyPathFromReplyRow(replyRow) {
        if (!replyRow) return '';

        var replyIndex = getReplyIndex(replyRow);
        if (replyIndex === -1) return '';

        var branchItem = replyRow.closest('.chat-branch-item');
        if (branchItem) {
          var parentItemPath = getItemPathFromContainer(branchItem);

          if (!parentItemPath) return '';
          return parentItemPath + '-reply-' + replyIndex;
        }

        var topItem = replyRow.closest('.chat-top-item');
        if (topItem) {
          var topPath = getItemPathFromContainer(topItem);
          if (!topPath) return '';
          return topPath + '-reply-' + replyIndex;
        }

        return '';
      }


      function getEditorLinkMetaFromTarget(target) {
        var branchItem = target.closest('.chat-branch-item');

        if (branchItem) {
          var branchRow = getChatRowFromContainer(branchItem),
              branchPath = getItemPathFromContainer(branchItem);
          
          return {
            type: 'item',
            path: branchPath ? branchPath + '-item-0' : '',
            node: branchRow || branchItem
          };
        }

        // check for a reply after ruling out branch items
        var replyRow = target.closest('.chat-reply-row');
        
        if (replyRow) {
          return {
            type: 'reply',
            path: getReplyPathFromReplyRow(replyRow),
            node: replyRow
          };
        }

        // top-level chat items
        var row = target.closest('.chat-row');
        
        if (row && row.parentNode &&
            row.parentNode.classList.contains('chat-top-item')) {
          return {
            type: 'item',
            path: getItemPathFromContainer(row.parentNode),
            node: row
          };
        }

        var topItem = target.closest('.chat-top-item');

        if (topItem) {
          return {
            type: 'item',
            path: getItemPathFromContainer(topItem),
            node: getChatRowFromContainer(topItem) || topItem
          };
        }

        return null;
      }


      function attachBranchPaths(replyItem, branchList, baseReplyPath) {
        if (!replyItem || !Array.isArray(replyItem) || !replyItem[1] || !branchList) return;

        var branchItems = Array.isArray(replyItem[1]) ? replyItem[1] : [replyItem[1]],
            branchDomItems = getBranchItems(branchList);

        branchItems.forEach(function(branchItem, index) {
          var branchDom = branchDomItems[index];
          if (!branchItem || !branchDom) return;

          var branchBasePath = baseReplyPath + '-branch-' + index;
          branchItem._editorLinkPath = branchBasePath;
          branchItem._editorLinkType = 'item';

          var row = getChatRowFromContainer(branchDom);
          if (!row) return;

          // assign a unique path to the actual row content of this branch item
          branchItem._editorNodePath = branchBasePath + '-item-0';

          attachReplyPaths(branchItem, row, branchBasePath);
        });
      }

      function attachReplyPaths(item, row, baseItemPath) {
        if (!item || !item.reply || !row) return;

        var replyRows = getReplyRows(row);
        item._replyEditorLinkPaths = [];

        replyRows.forEach(function(replyRow, index) {
          var replyPath = baseItemPath + '-reply-' + index;
          item._replyEditorLinkPaths[index] = replyPath;

          var branchWrap = replyRow.querySelector('.chat-branch-wrap'),
              branchList = branchWrap ? branchWrap.querySelector('.chat-branch-list') : null;

          if (!branchList) return;
          attachBranchPaths(item.reply[index], branchList, replyPath);
        });
      }

      function getLinkedChatPreviewData() {
        var data = [];

        getTopLevelChatItems().forEach(function(itemEl, index) {
          var row = getChatRowFromContainer(itemEl);
          if (!row) return;

          var item = getChatRowData(row),
              itemPath = 'item-' + index;

          if (Object.keys(item).length > 0) {
            item._editorLinkPath = itemPath;
            item._editorLinkType = 'item';
            attachReplyPaths(item, row, itemPath);
            data.push(item);
          }
        });

        return data;
      }

      function getBestPreviewTarget(linkPath, linkType) {
        if (!linkPath || !el.chatPreview) return null;
        
        var candidates = [linkPath];
        if (linkType === 'item') {
          candidates.push(/-item-0$/.test(linkPath) ? linkPath.replace(/-item-0$/, '') : linkPath + '-item-0');
        }
        for (var i = 0; i < candidates.length; i++) {
          var selector = '[data-chat-link-path="' + candidates[i] + '"][data-chat-link-type="' + linkType + '"]',
              matches = Array.from(el.chatPreview.querySelectorAll(selector));
          if (matches.length) return matches[0];
        }
      }

      function highlightLinkedPreviewElement(linkPath, linkType) {
        var target = getBestPreviewTarget(linkPath, linkType);
        if (!target) return;

        activePreviewLinkPath = linkPath;
        activePreviewLinkType = linkType;

        clearLinkedHighlights();

        target.scrollIntoView({
          behavior: 'instant',
          block: 'start'
        });

        target.classList.add('chat-preview-linked-highlight');
      }

      function findEditorNodeByPath(linkPath, linkType) {
        if (!linkPath) return null;

        if (linkType === 'reply') {
          return Array.from(document.querySelectorAll('.chat-reply-row')).find(function(row) {
            return getReplyPathFromReplyRow(row) === linkPath;
          }) || null;
        }

        if (/-branch-\d+-item-0$/.test(linkPath)) {
          var branchContainerPath = linkPath.replace(/-item-0$/, ''),
              branchMatch = Array.from(document.querySelectorAll('.chat-branch-item')).find(function(item) {
                return getItemPathFromContainer(item) === branchContainerPath;
              });

          if (branchMatch) {
            return getChatRowFromContainer(branchMatch) || branchMatch;
          }
        }

        var branchMatch = Array.from(document.querySelectorAll('.chat-branch-item')).find(function(item) {
          return getItemPathFromContainer(item) === linkPath;
        });

        if (branchMatch) {
          return getChatRowFromContainer(branchMatch) || branchMatch;
        }

        var topMatch = getTopLevelChatItems().find(function(item) {
          return getItemPathFromContainer(item) === linkPath;
        });

        if (topMatch) {
          return getChatRowFromContainer(topMatch) || topMatch;
        }

        return null;
      }

      function focusEditorNodeInput(target, linkType, suppressPreviewSync) {
        if (!target) return;

        var input = null;

        if (linkType === 'reply') {
          input = target.querySelector('.chat-reply-text');
        } else {
          var row = target.classList.contains('chat-row') ? target : getChatRowFromContainer(target);
          if (!row) return;

          var modeSelect = row.querySelector('.chat-item-type'),
              mode = modeSelect ? modeSelect.value : '';

          if (mode === 'message') input = row.querySelector('.chat-message');
          else if (mode === 'info') input = row.querySelector('.chat-info');
          else if (mode === 'delay') input = row.querySelector('.chat-delay');
          else if (mode === 'image') input = row.querySelector('.chat-image');
          else if (mode === 'input_reply') input = row.querySelector('.chat-input-response');
          else input = row.querySelector('input[type="text"], input[type="number"], textarea, select');
        }

        if (!input) return;

        if (suppressPreviewSync) {
          input.setAttribute('data-suppress-preview-sync', 'true');
        }

        input.focus({ preventScroll: true });

        if (suppressPreviewSync) {
          setTimeout(function() {
            input.removeAttribute('data-suppress-preview-sync');
          }, 0);
        }
      }

      function highlightLinkedEditorElement(linkPath, linkType) {
        var target = findEditorNodeByPath(linkPath, linkType);
        if (!target) return;

        activeEditorLinkPath = linkPath;
        activeEditorLinkType = linkType;

        clearLinkedHighlights();

        target.scrollIntoView({
          behavior: 'instant',
          block: 'start'
        });

        target.classList.add('chat-editor-linked-highlight');

        focusEditorNodeInput(target, linkType, true);
      }

      document.addEventListener('click', function(e) {
        if (!el.autoScroll.checked) return;
        
        if (window.EventClickDelay) {
          clearTimeout(window.EventClickDelay);
          delete window.EventClickDelay;
        }
        
        if (!window.EventClickDelay) {
          window.EventClickDelay = setTimeout(function() {
            if (el.pgType.value !== 'chat') return;
            if (e.target.hasAttribute('data-suppress-preview-sync')) return;

            var meta = getEditorLinkMetaFromTarget(e.target);
            if (!meta || !meta.path) return;
            
            activeEditorLinkPath = meta.path;
            activeEditorLinkType = meta.type;
            highlightLinkedPreviewElement(meta.path, meta.type);
            
            delete window.EventClickDelay;
          }, 10);
        }
      });

      // deprecated since this type of focus is handled in renderChatPreview now
      /*document.addEventListener('input', function(e) {
        if (!el.autoScroll.checked || !el.autoReload.checked) return;
        
        if (window.InputHighlightDelay) {
          clearTimeout(window.InputHighlightDelay);
          delete window.InputHighlightDelay;
        }
        
        if (!window.InputHighlightDelay) {
          window.InputHighlightDelay = setTimeout(function () {
            if (el.pgType.value !== 'chat') return;
            if (e.target.hasAttribute('data-suppress-preview-sync')) return;

            var meta = getEditorLinkMetaFromTarget(e.target);
            if (!meta || !meta.path) return;

            activeEditorLinkPath = meta.path;
            activeEditorLinkType = meta.type;
            highlightLinkedPreviewElement(meta.path, meta.type);
              
            delete window.InputHighlightDelay;
          }, 510);
        }
      });*/

      document.addEventListener('click', function(e) {
        // translation toggle
        var toggle = e.target.closest('#chat-preview .translation-toggler');
        if (toggle) {
          var wrapper = toggle.closest('.chat-preview-translatable');
          if (!wrapper) return;

          var original = wrapper.querySelector('.message-original'),
              translated = wrapper.querySelector('.message-translated');
          
          if (original || !translated) {
            var showingTranslation = translated.style.display !== 'none';

            if (showingTranslation) {
              translated.style.display = 'none';
              original.style.display = '';
              toggle.innerText = 'Show translation';
            } else {
              translated.style.display = '';
              original.style.display = 'none';
              toggle.innerText = 'Show original';
            }
          }
        }

        // preview highlight
        if (el.autoScroll.checked) {
          var previewNode =
            e.target.closest('#chat-preview .reply-choice[data-chat-link-path][data-chat-link-type]') ||
            e.target.closest('#chat-preview .chat-info[data-chat-link-path][data-chat-link-type]') ||
            e.target.closest('#chat-preview .chat-preview-delay[data-chat-link-path][data-chat-link-type]') ||
            e.target.closest('#chat-preview .message-row[data-chat-link-path][data-chat-link-type]') ||
            e.target.closest('#chat-preview .message-box[data-chat-link-path][data-chat-link-type]');

          if (previewNode) {
            activePreviewLinkPath = previewNode.getAttribute('data-chat-link-path');
            activePreviewLinkType = previewNode.getAttribute('data-chat-link-type');

            highlightLinkedEditorElement(activePreviewLinkPath, activePreviewLinkType);
          }
        }
      });
      
      // handle auto-scroll state
      var autoScrollCb = document.getElementById('auto-scroll-preview'),
          savedAutoScroll = localStorage.getItem('KN_Editor_autoScroll');
      
      if (savedAutoScroll !== null) {
        autoScrollCb.checked = savedAutoScroll === 'true';
      }
      
      autoScrollCb.addEventListener('change', function() {
        localStorage.setItem('KN_Editor_autoScroll', autoScrollCb.checked);
        if (!autoScrollCb.checked) clearLinkedHighlights();
      });
      
      setTimeout(function() {
        if (el.pgType.value === 'chat') {
          renderChatPreview(true);
        }
      }, 0);
      
      // finally, show page content
      Kantan.stopLoading();
    </script>
  </body>
</html>
