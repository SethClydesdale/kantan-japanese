    <script>Kantan.generateQuiz({
      authors : 'Kan-tan',
      type : 'chat',
      info : 'Practice what you have learned about katakana with Kan-tan!<br>It is recommended that you have learned about the <a href="../article-9/' + Kantan.local + '" target="_blank">46 Kana</a>, <a href="../article-10/' + Kantan.local + '" target="_blank">Dakuten and Handakuten</a>, <a href="../article-11/' + Kantan.local + '" target="_blank">Digraphs</a>, <a href="../article-12/' + Kantan.local + '" target="_blank">Extended Digraphs</a>, and the <a href="../article-13/' + Kantan.local + '" target="_blank">Small ッ and Long Vowels</a> before doing this exercise.',

      quizlet : [
        {
          reply : [
            'Hi, Kan-tan.'
          ]
        },
        
        {
          reply : [
            'I just finished studying Katakana.'
          ]
        },
        
        {
          delay : 1000,
          reply : [
            'Would you like to help me practice it?'
          ]
        },
        
        {
          delay : 3000,
          info : '{RED}<b>Kan-tan</b> has gone offline.'
        },
        
        {
          delay : 2000,
          info : '{GREEN}<b>Kan-tan</b> is now online.'
        },
        
        {
          message : 'Zzz...  :=v=:'
        },
        
        {
          reply : [
            'Quit playing around! I know you\'re there, Kan-tan!'
          ]
        },
        
        {
          message : 'Heehee, I\'m sorry! I\'d love to practice with you!'
        },
        
        {
          delay : 2000,
          message : 'I was just lying in the park petting a kitty and next thing you know I fell asleep!! :clueless:'
        },
        
        {
          message : 'Warm sunlight and fluffy kitties are not to be underestimated...'
        },
        
        {
          delay : 1000
        },
        
        {
          message : 'So are you ready to start practicing now?',
          newList : true
        },
        
        {
          reply : [
            'Of course!',
            [
              'Zzz...',
              [
                {
                  message : 'Oh? If you\'re sleeping I\'ll just go back to petting the kitties, then! :^^:'
                },
                {
                  delay : 1000
                },
                {
                  info : '{RED}<b>Kan-tan</b> has gone offline.'
                },
                {
                  delay : 1000
                },
                {
                  delay : 1000,
                  reply : [
                    'Wait, come back, Kan-tan! I was joking!!'
                  ]
                },
                {
                  delay : 1000
                },
                {
                  info : '{GREEN}<b>Kan-tan</b> is now online.'
                },
                {
                  delay : 1000
                },
                {
                  message : 'Heehee, you\'re so much fun to tease :^^:'
                },
                {
                  delay : 1000
                }
              ]
            ]
          ]
        },
        
        {
          message : 'Okay, we\'ll practice the same way as we did with Hiragana!',
          newList : true
        },
        
        {
          message : 'I\'ll type out some words in Katakana and you reply back to me with the romaji for those words.'
        },
        
        {
          delay : 2000,
          message : 'Let\'s begin!'
        },
        
        {
          message : 'アメリカ',
          newList : true
        },
        
        {
          reply : [
            [
              'ameruka',
              [
                {
                  message : 'Close! It\'s ameRIka!'
                },
                {
                  message : 'リ (ri) and ル (ru) look kinda similar in Katakana so they can be easy to mix up'
                },
                {
                  delay : 1500
                }
              ]
            ],
            [
              '〇amerika',
              {
                message : 'You got it!'
              }
            ]
          ],
          problem : true
        },
        
        {
          message : 'アメリカ, if you haven\'t figured it out by the romaji, means America!',
          newList : true
        },
        
        {
          delay : 2500,
          message : 'That\'s where my Dad was born and used to live before he moved to Japan for work.'
        },
        
        {
          reply : [
            'What does your dad do for a living?'
          ]
        },
        
        {
          message : 'He teaches English!'
        },
        
        {
          message : 'Oh and he also does work as a translator!'
        },
        
        {
          message : "I think he's amazing :XD:"
        },
        
        {
          message : 'Okay, next up is... カレーライス!',
          newList : true
        },
        
        {
          reply : [
            [
              '〇kareeraisu',
              {
                message : 'Correct!'
              }
            ],
            [
              'kareraisu',
              [
                {
                  message : 'Almost!'
                },
                {
                  message : 'When there\'s a long-vowel mark (ー) you have to extend the sound that comes before it'
                },
                {
                  delay : 2500,
                  message : 'So カレー is read karee instead of kare (カレ)'
                },
                {
                  delay : 1000
                }
              ]
            ]
          ],
          problem : true
        },
        
        {
          delay : 1000
        },
        
        {
          message : 'カレーライス means curry rice which is a compound word for curry and rice.',
          newList : true
        },
        
        {
          delay : 2500,
          message : 'It\'s a popular dish in Japan where curry (usually made with beef, potatoes, carrots, and curry roux) is served with a side of rice on a plate.'
        },
        
        {
          delay : 3500,
          message : 'My Mom makes the BESTEST sweet curry with lots of apples and honey that\'s to die for :hungry:'
        },
        
        {
          reply : [
            [
              'Mmm, you\'re making me want some now...',
              [
                {
                  message : 'Sometimes my Mom packs leftover curry for lunch.'
                },
                {
                  message : 'If you do good on your tests then maybe I\'ll share some with you!'
                },
                {
                  delay : 1000
                }
              ]
            ],
            [
              'Wouldn\'t that be too sweet?',
              [
                {
                  message : 'Not at all!'
                },
                {
                  message : 'The sweetness of the apples and honey perfectly balances out the saltiness and spiciness of the curry!'
                },
                {
                  delay : 2500,
                  message : '...though I usually like adding extra honey to mine :guilty:'
                },
                {
                  delay : 1000
                }
              ]
            ]
          ]
        },
        
        {
          message : 'Next word is... アレルギー!',
          newList : true
        },
        
        {
          reply : [
            [
              'arerukii',
              [
                {
                  message : 'You got the long vowel correct! But you mixed up ギ (gi) with キ (ki)'
                },
                {
                  delay : 2000,
                  message : 'Whenever キ has those two little dashes, it changes from KI to GI!'
                },
                {
                  delay : 2000,
                  message : 'This goes for all the characters in the カ (ka) column, too!'
                },
                {
                  delay : 1000
                }
              ]
            ],
            [
              '〇arerugii',
              {
                message : 'Yep! Yep! That\'s right!'
              },
              {
                delay : 1000
              }
            ]
          ],
          problem : true
        },
        
        {
          message : 'アレルギー means allergy!',
          newList : true
        },
        
        {
          message : 'I was cursed with an allergy to cats despite liking them SO much :sad:'
        },
        
        {
          delay : 2500,
          message : 'Sometimes I even have a sneezing fit while I\'m petting them!'
        },
        
        {
          message : 'Life can be so unfair sometimes... :pout:'
        },
        
        {
          reply : [
            'On the bright side you\'re not allergic to candy at least.'
          ]
        },
        
        {
          message : 'That\'s true!!'
        },
        
        {
          message : 'If I was, I would be really really REALLY sad! :sad:'
        },
        
        {
          delay : 1000
        },
        
        {
          message : 'Next is コレクション!',
          newList : true
        },
        
        {
          reply : [
            [
              'korekushiyon',
              [
                {
                  message : 'Sho close!'
                },
                {
                  message : 'If you look closely at the ショ (sho) in this one you should notice that the ヨ (yo) is smaller. See? ショヨ'
                },
                {
                  delay : 3500,
                  message : 'When it\'s small like this, it makes a contracted sound with the kana before it, so シ (shi, drop the i) + ョ (yo, drop the y) turns into sho!'
                },
                {
                  delay : 2500
                }
              ]
            ],
            [
              '〇korekushon',
              {
                message : 'Dingy ding ding! That\'s the right answer!'
              }
            ]
          ],
          problem : true
        },
        
        {
          message : 'コレクション is a loanword that means collection!',
          newList : true
        },
        
        {
          message : 'Do you like collecting things? I have a big collection of cute and cool <ruby>スニーカー<rt>suniikaa</rt></ruby> myself!'
        },
        
        {
          delay : 2000,
          message : 'Look! This one is my favorite!!'
        },
        
        {
          image : 'shoe.webp'
        },
        
        {
          delay : 1000
        },
        
        {
          reply : [
            [
              'Woah, that\'s really cute!',
              [
                {
                  message : 'Right?'
                },
                {
                  message : 'I love the cat design so much!'
                },
                {
                  message : 'It even has a cute little cat paw on the bottom!'
                },
                {
                  image : 'shoe-sole.webp'
                },
                {
                  message : 'Isn\'t that neat!? :XD:'
                },
                {
                  delay : 2500
                }
              ]
            ],
            [
              'It\'s uh... unique?',
              [
                {
                  message : 'Aww, c\'mon it\'s cute! :pout:'
                },
                {
                  message : 'Especially that adorable little kitty face on the tongue of the sneaker :XD:'
                },
                {
                  delay : 2000
                }
              ]
            ]
          ]
        },
        
        {
          message : 'Sorry! I always get carried away when it comes to my sneakers lol',
          newList : true
        },
        
        {
          message : 'Okay, our next word is... フェスティバル!'
        },
        
        {
          reply : [
            [
              '〇fesutibaru{FLAG:INCORRECT}',
              [
                {
                  delay : 1000
                },
                {
                  message : 'Nope! That\'s wrong!'
                },
                {
                  reply : [
                    'Wait, really???'
                  ]
                },
                {
                  message : 'Just kidding! You got it right!{FLAG:CLEAR_INCORRECT}'
                },
                {
                  message : 'I bet I had you going there for a moment :XD:'
                },
                {
                  delay : 1000
                }
              ]
            ],
            [
              'fuesuteibaru',
              [
                {
                  message : 'I knew this one might be tricky for you!'
                },
                {
                  message : 'If you look closely at <ruby>フェスティバル<rt>fesutibaru</rt></ruby> you should notice that the エ and イ are smaller'
                },
                {
                  delay : 3000,
                  message : 'When these are combined with other kana they create contracted sounds like フェ (fe) and ティ (ti)'
                },
                {
                  delay : 3000,
                  message : 'These ones are unique to Katakana so they can sometimes take a bit to learn, but I know you can do it!! :azoos:'
                },
                {
                  delay : 2000,
                }
              ]
            ]
          ],
          problem : true
        },
        
        {
          message : 'フェスティバル means festival btw',
          newList : true
        },
        
        {
          message : 'Japan has a loooooot of festivals for all sorts of things and they\'re all so much fun to go to!'
        },
        
        {
          reply : [
            'Which festival would you recommend I check out while I\'m in Japan?'
          ]
        },
        
        {
          message : 'Ooh definitely the Kagurazaka Bakeneko festival in Shinjuku!'
        },
        
        {
          message : 'There\'s cats, parades where people dress up as cats, and even candy!'
        },
        
        {
          message : 'I always go with my little sister and it\'s a ton of fun! :XD:'
        },
        
        {
          reply : [
            [
              'Do you go for the cats or the candy?',
              {
                message : 'Both of course!! :XD:'
              },
              {
                delay : 2000
              }
            ],
            [
              'Of course it would be about cats...',
              [
                {
                  message : 'What can I say? I love kitties :=v=:'
                },
                {
                  message : 'What? Do you hate cats or something? :pout:'
                },
                {
                  reply : [
                    'N-No...'
                  ]
                },
                {
                  message : 'Good! Because if you did... :^^:'
                },
                {
                  delay : 2000
                }
              ]
            ]
          ]
        },
        
        {
          message : 'Anyway! The last word is... フィッシュ!',
          newList : true
        },
        
        {
          reply : [
            [
              'fitsushu',
              [
                {
                  message : 'Almost! Look closely at フィッシュ and you\'ll notice that the ツ is smaller'
                },
                {
                  delay : 2500,
                  message : 'When it\'s small like this it duplicates the sound that comes afterwards, just like with Hiragana!'
                },
                {
                  delay : 3000,
                  message : 'So in this case it becomes fisshu!'
                },
                {
                  delay : 2000
                }
              ]
            ],
            [
              '〇fisshu',
              {
                message : 'That\'s correct!'
              }
            ]
          ],
          problem : true
        },
        
        {
          message : 'Wow! I can\'t believe you got all of them correct! :clueless:',
          score : 6,
          newList : true
        },
        
        {
          message : 'You really studied up on your Katakana, huh?',
          score : 6
        },
        
        {
          message : 'Great work!! I\'ll give you some of my favorite candy later! :XD:',
          score : 6
        },
        
        {
          message : 'Aww you got them all wrong... :sad:',
          score : 0,
          newList : true
        },
        
        {
          message : 'Don\'t give up though!! :azoos:',
          score : 0
        },
        
        {
          message : 'Kanny is always here to help you practice until you get them all correct!',
          score : 0
        },
        
        {
          delay : 2000,
          message : 'Oh and フィッシュ means fish!',
          newList : true
        },
        
        {
          message : 'Do you like fish?'
        },
        
        {
          reply : [
            [
              'Yeah, they\'re pretty neat.',
              [
                {
                  message : 'Aren\'t they!?'
                },
                {
                  message : 'And some of them are cute too!'
                }
              ]
            ],
            [
              'Nah, I don\'t really care for them.',
              {
                message : 'Aww, but they\'re so cute!'
              }
            ]
          ]
        },
        
        {
          message : 'Since I can\'t have a cat at home, I have a pet goldfish instead and he\'s an adorable little thing!'
        },
        
        {
          delay : 2000,
          message : 'He always does a cute little dance when I\'m about to feed him :=v=:'
        },
        
        {
          delay : 2000,
          message : 'I guess that\'ll be it for today!',
          newList : true
        },
        
        {
          message : 'It was fun practicing with you, {NAME}!'
        },
        
        {
          reply : [
            'It was. Thanks again!'
          ]
        },
        
        {
          reply : [
            'See you later, Kan-tan.'
          ]
        },
        
        {
          message : 'Hey, wait!'
        },
        
        {
          message : 'Since we\'re pretty much friends now, call me Kanny!'
        },
        
        {
          reply : [
            'Kanny...?'
          ]
        },
        
        {
          delay : 3000,
          message : 'Yeah! My name is <ruby>カンたん<rt>Kan-tan</rt></ruby> , but my Dad said that if you translate the -tan suffix (cutesy version of the familiar -chan suffix) my name would be <ruby>カンニー<rt>Kanny</rt></ruby>!'
        },
        
        {
          delay : 3000,
          message : 'I think it sounds cute! Don\'t you?'
        },
        
        {
          reply : [
            [
              'Just as cute as Kanny!',
              {
                message : 'Aww, I\'m not THAT cute :XD:'
              }
            ],
            [
              'I guess...',
              [
                {
                  message : 'What\'s that supposed to mean??? :pout:'
                },
                {
                  reply : [
                    'I\'m just teasing you cause you\'re cute when you\'re flustered, Kanny.'
                  ]
                },
                {
                  message : 'Grrrr that\'s not fair!!'
                },
                {
                  message : 'I\'m not gonna give you anymore candy if you pull mean tricks like that again! :pout:'
                }
              ]
            ]
          ]
        },
        
        {
          reply : [
            'Okay, see you later, Kanny!'
          ]
        },
        
        {
          message : 'Bye! Good luck on your studies!! :^^:'
        },
        
        {
          delay : 1000
        }
      ]
    });</script>
