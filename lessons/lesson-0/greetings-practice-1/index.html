    <script>Kantan.generateQuiz({
      authors : 'Kan-tan',
      format : 'practice',
      type : ['fill', 'multi'],
      info : 'Practice using the Japanese greetings you have learned.',

      quizlet : [
        '<p class="sectionDesc"><i class="sectionArrow fa"></i> Answer the following questions by using the proper greeting/expression for the situation.</p>\n'+
        '\n'+
        '<div class="count-problems indent-block">\n'+
        '  <div class="problem">\n'+
        '    <div class="inner-problem">\n'+
        '      It is eight o\'clock in the morning and you run into your friend.<br>How do you greet your friend?<br>\n'+
        '      {おはよう||width:200}。\n'+
        '    </div>\n'+
        '  </div>\n'+
        '  \n'+
        '  <div class="problem">\n'+
        '    <div class="inner-problem">\n'+
        '      You have arrived at your morning class.<br>How do you greet your teacher?<br>\n'+
        '      {おはようございます||width:200}。\n'+
        '    </div>\n'+
        '  </div>\n'+
        '  \n'+
        '  <div class="problem">\n'+
        '    <div class="inner-problem">\n'+
        '      It is twelve o\'clock in the afternoon and you happen to run into your neighbor.<br>How do you greet your neighbor?<br>\n'+
        '      {こんにちは||width:200}。\n'+
        '    </div>\n'+
        '  </div>\n'+
        '  \n'+
        '  <div class="problem">\n'+
        '    <div class="inner-problem">\n'+
        '      It is ten o\'clock at night and you greet the convenience store clerk.<br>How do you greet the clerk?<br>\n'+
        '      {こんばんは||width:200}。\n'+
        '    </div>\n'+
        '  </div>\n'+
        '  \n'+
        '  <div class="problem">\n'+
        '    <div class="inner-problem">\n'+
        '      You are leaving school and will see your friend tomorrow.<br>How do you bid your friend farewell?<br>\n'+
        '      {またあした|またね|answer;width:200}。\n'+
        '    </div>\n'+
        '  </div>\n'+
        '  \n'+
        '  <div class="problem">\n'+
        '    <div class="inner-problem">\n'+
        '      You are leaving to visit another country for a year.<br>How do you bid farewell to your friends and family?<br>\n'+
        '      {さようなら||width:200}。\n'+
        '    </div>\n'+
        '  </div>\n'+
        '  \n'+
        '  <div class="problem">\n'+
        '    <div class="inner-problem">\n'+
        '      You are visiting the principal\'s office.<br>What do you say before entering the room?<br>\n'+
        '      {しつれいします||width:200}。\n'+
        '    </div>\n'+
        '  </div>\n'+
        '  \n'+
        '  <div class="problem">\n'+
        '    <div class="inner-problem">\n'+
        '      You are going to bed.<br>What do you say to your family?<br>\n'+
        '      {おやすみなさい|おやすみ|answer;width:200}。\n'+
        '    </div>\n'+
        '  </div>\n'+
        '  \n'+
        '  <div class="problem">\n'+
        '    <div class="inner-problem">\n'+
        '      You are about to leave your home.<br>What do you say to your family?<br>\n'+
        '      {いってきます||width:200}。\n'+
        '    </div>\n'+
        '  </div>\n'+
        '  \n'+
        '  <div class="problem">\n'+
        '    <div class="inner-problem">\n'+
        '      Your brother is leaving the house.<br>What do you say to him?<br>\n'+
        '      {いってらっしゃい||width:200}。\n'+
        '    </div>\n'+
        '  </div>\n'+
        '  \n'+
        '  <div class="problem">\n'+
        '    <div class="inner-problem">\n'+
        '      You have just returned home.<br>What do you say to your family?<br>\n'+
        '      {ただいま|ただいまかえりました|answer;width:200}。\n'+
        '    </div>\n'+
        '  </div>\n'+
        '  \n'+
        '  <div class="problem">\n'+
        '    <div class="inner-problem">\n'+
        '      Your sister has returned home.<br>What do you say to her?<br>\n'+
        '      {おかえりなさい|おかえり|answer;width:200}。\n'+
        '    </div>\n'+
        '  </div>\n'+
        '</div>\n'+
        '\n'+
        '\n'+
        '\n',
        
        [
              {
                      "question": "It is eight o'clock in the morning and you run into your friend. How do you greet your friend?",
                      "answers": [
                              "Aおはよう",
                              "おはようございます",
                              "こんにちは",
                              "こんばんは"
                      ]
              },
              {
                      "question": "You have arrived at your morning class. How do you greet your teacher?",
                      "answers": [
                              "Aおはようございます",
                              "おはよう",
                              "こんにちは",
                              "こんばんは"
                      ]
              },
              {
                      "question": "It is twelve o'clock in the afternoon and you happen to run into your neighbor. How do you greet your neighbor?",
                      "answers": [
                              "Aこんにちは",
                              "こんばんは",
                              "おはようございます",
                              "おはよう"
                      ]
              },
              {
                      "question": "It is ten o'clock at night and you greet the convenience store clerk. How do you greet the clerk?",
                      "answers": [
                              "Aこんばんは",
                              "こんにちは",
                              "おはようございます",
                              "おはよう"
                      ]
              },
              {
                      "question": "You are leaving school and will see your friend tomorrow. How do you bid your friend farewell?",
                      "answers": [
                              "Aまたあした",
                              "Aまたね",
                              "さようなら",
                              "おやすみ"
                      ]
              },
              {
                      "question": "You are leaving to visit another country for a year. How do you bid farewell to your friends and family?",
                      "answers": [
                              "Aさようなら",
                              "またあした",
                              "またね",
                              "おやすみなさい"
                      ]
              },
              {
                      "question": "You are visiting the principal's office. What do you say before entering the room?",
                      "answers": [
                              "Aしつれいします",
                              "はじめまして",
                              "ただいま",
                              "こんにちは"
                      ]
              },
              {
                      "question": "You are going to bed. What do you say to your family?",
                      "answers": [
                              "Aおやすみなさい",
                              "Aおやすみ",
                              "こんばんば",
                              "さようなら"
                      ]
              },
              {
                      "question": "You are about to leave your home. What do you say to your family?",
                      "answers": [
                              "Aいってきます",
                              "いってらっしゃい",
                              "ただいま",
                              "おかえりなさい"
                      ]
              },
              {
                      "question": "Your brother is leaving the house and has just said いってきます. What do you say in response?",
                      "answers": [
                              "Aいってらっしゃい",
                              "いってきます",
                              "ただいま",
                              "おかえりなさい"
                      ]
              },
              {
                      "question": "You have just returned home. What do you say to your family?",
                      "answers": [

                              "おかえりなさい",
                              "いってらっしゃい",
                              "いってきます"
                      ]
              },
              {
                      "question": "Your sister has returned home and has just said ただいま. What do you say in response?",
                      "answers": [
                              "Aおかえりなさい",
                              "Aおかえり",
                              "いってらっしゃい",
                              "ただいま"
                      ]
              }
      ]
