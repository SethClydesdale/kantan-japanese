    <script>Kantan.generateQuiz({
      authors : 'Kan-tan',
      format : 'practice',
      type : ['fill', 'multi'],
      info : 'Practice using the Japanese greetings you have learned.',

      quizlet : [
        '<p class="sectionDesc"><i class="sectionArrow fa"></i>Answer the following questions by using the proper greeting/expression for the situation.</p>\n'+
        '\n'+
        '<div class="count-problems indent-block">\n'+
        '  <div class="problem">\n'+
        '    <div class="inner-problem">\n'+
        '      You are introducing yourself to the class.<br>What do you say to everyone?<br>\n'+
        '      {はじめまして}、NAME{です}。<br><br>\n'+
        '      {よろしくおねがいします||width:200}。\n'+
        '    </div>\n'+
        '  </div>\n'+
        '  \n'+
        '  <div class="problem">\n'+
        '    <div class="inner-problem">\n'+
        '      You are about to eat dinner.<br>What do you say?<br>\n'+
        '      {いただきます||width:200}。\n'+
        '    </div>\n'+
        '  </div>\n'+
        '  \n'+
        '  <div class="problem">\n'+
        '    <div class="inner-problem">\n'+
        '      You have just finished eating dinner.<br>What do you say?<br>\n'+
        '      {ごちそうさまでした|ごちそうさま|answer;width:200}。\n'+
        '    </div>\n'+
        '  </div>\n'+
        '  \n'+
        '  <div class="problem">\n'+
        '    <div class="inner-problem">\n'+
        '      You ask a friend for a favor.<br>What do you say after asking for help?<br>\n'+
        '      {おねがいします||width:200}。\n'+
        '    </div>\n'+
        '  </div>\n'+
        '  \n'+
        '  <div class="problem">\n'+
        '    <div class="inner-problem">\n'+
        '      You hand a gift to your friend.<br>What do you say while handing it out?<br>\n'+
        '      {どうぞ||width:200}。\n'+
        '    </div>\n'+
        '  </div>\n'+
        '  \n'+
        '  <div class="problem">\n'+
        '    <div class="inner-problem">\n'+
        '      The teacher asks if you are present in class.<br>You are, so what do you say in response?<br>\n'+
        '      {はい||width:200}。\n'+
        '    </div>\n'+
        '  </div>\n'+
        '  \n'+
        '  <div class="problem">\n'+
        '    <div class="inner-problem">\n'+
        '      A stranger asks if the phone they found is yours.<br>It is not, so what do you say in response?<br>\n'+
        '      {いいえ||width:200}。\n'+
        '    </div>\n'+
        '  </div>\n'+
        '  \n'+
        '  <div class="problem">\n'+
        '    <div class="inner-problem">\n'+
        '      A stranger picked up the wallet you dropped and handed it to you.<br>What do you say to thank them?<br>\n'+
        '      {ありがとうございます||width:200}。\n'+
        '    </div>\n'+
        '  </div>\n'+
        '  \n'+
        '  <div class="problem">\n'+
        '    <div class="inner-problem">\n'+
        '      Your friend passed their exam.<br>What do you say to congratulate them?<br>\n'+
        '      {おめでとう||width:200}。\n'+
        '    </div>\n'+
        '  </div>\n'+
        '  \n'+
        '  <div class="problem">\n'+
        '    <div class="inner-problem">\n'+
        '      Your classmate thanks you for helping them study.<br>What do you say in response?<br>\n'+
        '      {どういたしまして|いいえ|いえいえ|answer;width:200}。\n'+
        '    </div>\n'+
        '  </div>\n'+
        '  \n'+
        '  <div class="problem">\n'+
        '    <div class="inner-problem">\n'+
        '      You accidentally bumped into someone on the train.<br>What do you say to apologize?<br>\n'+
        '      {すみません||width:200}。\n'+
        '    </div>\n'+
        '  </div>\n'+
        '  \n'+
        '  <div class="problem">\n'+
        '    <div class="inner-problem">\n'+
        '      You accidentally broke your best friend\'s bike.<br>What do you say to apologize?<br>\n'+
        '      {ごめんなさい|ごめん|answer;width:200}。\n'+
        '    </div>\n'+
        '  </div>\n'+
        '</div>\n'+
        '\n',
        
        [
              {
                      "question": "You are introducing yourself to the class. What do you say to everyone?",
                      "answers": [
                              "Aはじめまして、NAMEです。よろしくおねがいします。",
                              "はじめまして、NAMEおねがいします。よろしくです。",
                              "こんにちは、NAMEです。よろしくおねがいします。",
                              "こんにちは、NAMEおねがいします。よろしくです。"
                      ]
              },
              {
                      "question": "You are about to eat dinner. What do you say?",
                      "answers": [
                              "Aいただきます",
                              "ごちそうさまでした",
                              "いってらっしゃい",
                              "ありがとうございます"
                      ]
              },
              {
                      "question": "You have just finished eating dinner. What do you say?",
                      "answers": [
                              "Aごちそうさまでした",
                              "いただきます",
                              "いってらっしゃい",
                              "ありがとうございます"
                      ]
              },
              {
                      "question": "You ask a friend for a favor. What do you say after asking for help?",
                      "answers": [
                              "Aおねがいします",
                              "どういたしまして",
                              "ありがとうございます",
                              "どうぞ"
                      ]
              },
              {
                      "question": "You hand a gift to your friend. What do you say while handing it out?",
                      "answers": [
                              "Aどうぞ",
                              "どういたしまして",
                              "おねがいします",
                              "おめでとうございます"
                      ]
              },
              {
                      "question": "The teacher asks if you are present in class. You are, so what do you say in response?",
                      "answers": [
                              "Aはい",
                              "いいえ",
                              "おやすみなさい",
                              "さようなら"
                      ]
              },
              {
                      "question": "A stranger asks if the phone they found is yours. It is not, so what do you say in response?",
                      "answers": [
                              "Aいいえ",
                              "はい",
                              "ありがとうございます",
                              "すみません"
                      ]
              },
              {
                      "question": "A stranger picked up the wallet you dropped and handed it to you. What do you say to thank them?",
                      "answers": [
                              "Aありがとうございます",
                              "ありがとう",
                              "おめでとうございます",
                              "おめでとう"
                      ]
              },
              {
                      "question": "Your friend passed their exam. What do you say to congratulate them?",
                      "answers": [
                              "Aおめでとう",
                              "おめでとうございます",
                              "ありがとうございます",
                              "ありがとう"
                      ]
              },
              {
                      "question": "Your classmate thanks you for helping them study. What do you say in response?",
                      "answers": [
                              "Aどういたしまして",
                              "Aいいえ",
                              "はい",
                              "どうぞ"
                      ]
              },
              {
                      "question": "You accidentally bumped into someone on the train. What do you say to apologize?",
                      "answers": [
                              "Aすみません",
                              "どういたしまして",
                              "いいえ",
                              "ごちそうさまでした"
                      ]
              },
              {
                      "question": "You accidentally broke your best friend's bike. What do you say to apologize?",
                      "answers": [
                              "Aごめんなさい",
                              "どういたしまして",
                              "いいえ",
                              "どうぞ"
                      ]
              }
      ]
      ]
